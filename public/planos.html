<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Comprar créditos · Leitor de Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
.app{
--bg:#FAFAF9;--sf:#FFFFFF;--sk:#F4F4F2;--ln:#E7E6E3;--ln2:#F0EFEC;--ink:#151515;--i2:#55585E;--mu:#6B6E75;
--br:#0E6B4F;--bi:#FFFFFF;--bs:#E7F3EE;--bsi:#0B5A42;--ac:#0E6B4F;--acs:rgba(14,107,79,.14);
--pos:#0E6B4F;--neg:#B42318;--wb:#FDF3E1;--wi:#8A5300;--db:#FCEBEA;--di:#B42318;--ob:#E7F3EE;--oi:#0B5A42;--ds:#B42318;--dsi:#FFFFFF;
--cb:#BFDFCF;--cz:#E7E6E3;--tst:#151515;--tsi:#FFFFFF;
--sc:rgba(21,21,21,.32);--sh2:0 24px 48px -12px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04);
--serif:'Geist',ui-sans-serif,system-ui,sans-serif;
display:flex;flex-wrap:wrap;align-items:stretch;background:var(--bg);color:var(--ink);font:400 14px/20px 'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.app.dark{
--bg:#0B0C0D;--sf:#121314;--sk:#1A1B1D;--ln:#26282B;--ln2:#1E2022;--ink:#EDEDEC;--i2:#A6A8AD;--mu:#8A8D93;
--br:#34B37F;--bi:#04130C;--bs:rgba(52,179,127,.14);--bsi:#6FD3A8;--ac:#34B37F;--acs:rgba(52,179,127,.2);
--pos:#6FD3A8;--neg:#F28B82;--wb:rgba(245,166,35,.14);--wi:#F5C469;--db:rgba(240,82,72,.14);--di:#F7A39C;--ob:rgba(52,179,127,.14);--oi:#6FD3A8;--ds:#F28B82;--dsi:#2A0805;
--cb:#1D4F3B;--cz:#26282B;--tst:#EDEDEC;--tsi:#121314;
--sc:rgba(0,0,0,.55);--sh2:0 24px 48px -12px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05)}
.app h1,.app h2,.app h3,.app p{margin:0}
.app a{color:inherit}
.app svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app svg.s{width:16px;height:16px}
.app button,.app input,.app textarea{font-family:inherit}
.app :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;line-height:16px;color:var(--mu)}
.mu{color:var(--mu)}.t2{color:var(--i2)}.pos{color:var(--pos)}.neg{color:var(--neg)}

/* estrutura */
.side{flex:0 0 232px;display:flex;flex-direction:column;padding:16px 12px;background:var(--sf);border-right:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 6px;min-height:40px}
.logo{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--br);color:var(--bi)}
.logo svg.i{width:16px;height:16px;stroke-width:2}
.bn{display:flex;flex-direction:column;font-weight:600;font-size:14px;line-height:18px;letter-spacing:-.01em}
.bn small{font-weight:400;font-size:12px;line-height:16px;color:var(--mu);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:20px}
.nav a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:7px;color:var(--i2);text-decoration:none;font-weight:500;font-size:14px}
.nav a svg{color:var(--mu)}
.nav a:hover{color:var(--ink);background:var(--sk)}
.nav a.on{background:var(--sk);color:var(--ink);font-weight:600}
.nav a.on svg{color:var(--ac)}
.nav .n{margin-left:auto;font:500 12px/16px 'Geist Mono',monospace;color:var(--mu)}
.nav .n.al{color:var(--wi)}
.sfoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid var(--ln)}
.sfoot .who{flex:1;min-width:0;font-size:13px;line-height:16px;font-weight:500}
.sfoot .who small{display:block;font-weight:400;font-size:12px;color:var(--mu)}
.main{flex:999 1 560px;min-width:0;padding:28px 40px 56px}
.wrap{max-width:1120px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-bottom:24px}
.top h1{font:600 24px/32px 'Geist',sans-serif;letter-spacing:-.02em}
.top .sub{color:var(--mu);margin-top:2px;font-size:13px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:500 14px/20px 'Geist',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sk)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.pri{background:var(--br);border-color:var(--br);color:var(--bi)}
.btn.pri:hover{background:var(--br);filter:brightness(1.1)}
.btn.dng{background:var(--ds);border-color:var(--ds);color:var(--dsi)}
.btn.gh{border-color:transparent;background:transparent;color:var(--i2)}
.btn.gh:hover{background:var(--sk);color:var(--ink)}
.btn.out-d{color:var(--neg)}
.btn.blk{width:100%}
.btn.ibtn,.ibtn{width:36px;height:36px;padding:0}
.in{height:36px;width:100%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:0 12px;font:400 14px/20px 'Geist',sans-serif;transition:border-color .12s,box-shadow .12s}
.in::placeholder{color:var(--mu)}
.in:focus,.in:focus-visible{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
textarea.in{height:auto;min-height:84px;padding:8px 12px;resize:vertical}
.srch{position:relative;flex:1 1 260px;max-width:360px}
.srch svg{position:absolute;left:11px;top:10px;color:var(--mu)}
.srch .in{padding-left:36px}
.srch kbd{position:absolute;right:8px;top:8px;font:500 11px/18px 'Geist Mono',monospace;color:var(--mu);border:1px solid var(--ln);border-radius:5px;padding:0 5px;background:var(--sk)}
.lb{display:block;font:500 13px/16px 'Geist',sans-serif;margin-bottom:6px;color:var(--ink)}
.hint{font-size:12px;line-height:16px;color:var(--mu);margin-top:6px}
.fld{margin-bottom:16px}
.frow{display:flex;gap:8px}
.seg{display:inline-flex;gap:0;padding:2px;background:var(--sk);border-radius:9px;max-width:100%;overflow-x:auto}
.seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--i2);font:500 13px/16px 'Geist',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--ln)}
.dark .seg button.on{background:#232527;box-shadow:none}
.seg .c{font:500 12px/16px 'Geist Mono',monospace;color:var(--mu)}
.seg .c.al{color:var(--wi)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:500 12px/16px 'Geist Mono',monospace;cursor:pointer}
.chips button:hover{background:var(--sk)}

/* cartões */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ln)}
.ch h2{font:600 14px/20px 'Geist',sans-serif;display:flex;align-items:center;gap:8px}
.ch h2 .ct{font:500 12px/16px 'Geist Mono',monospace;color:var(--mu)}
.ch a{font-size:13px;font-weight:500;color:var(--i2);text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.ch a:hover{color:var(--ink)}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:20px}

/* receita */
.rev{margin-bottom:20px}
.rev-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 22px 8px}
.lab{font:500 13px/16px 'Geist',sans-serif;color:var(--i2)}
.rv{font:600 40px/48px 'Geist',sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
.rv .cur{font-size:20px;font-weight:500;color:var(--mu);letter-spacing:-.01em;margin-right:4px}
.rv .cents{color:var(--mu);font-weight:500}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:4px;font-size:13px;color:var(--mu)}
.meta b{color:var(--pos);font-weight:600}
.lg{display:flex;gap:16px;font-size:12px;color:var(--mu);align-items:center}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:2px;background:var(--cb);display:block}
.lg i.h{background:var(--ac)}
.plot{display:flex;gap:12px;padding:16px 22px 20px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:180px;width:48px;flex:none;font:400 11px/14px 'Geist Mono',monospace;color:var(--mu);text-align:right}
.yax span{height:0;display:flex;align-items:center;justify-content:flex-end}
.pa{flex:1;min-width:0}
.bars{display:flex;align-items:flex-end;gap:5px;height:180px;background-image:linear-gradient(to top,var(--ln2) 1px,transparent 1px);background-size:100% 33.333%;background-position:bottom;border-bottom:1px solid var(--ln)}
.bars i{flex:1;min-height:2px;background:var(--cb);border-radius:3px 3px 0 0;position:relative}
.bars i.z{background:var(--cz)}
.bars i.hj{background:var(--ac)}
.bars i.hj::after{content:attr(data-v);position:absolute;bottom:calc(100% + 6px);right:0;white-space:nowrap;font:600 11px/14px 'Geist Mono',monospace;color:var(--bi);background:var(--br);padding:3px 6px;border-radius:5px}
.xax{display:flex;justify-content:space-between;margin-top:8px;font:400 11px/14px 'Geist Mono',monospace;color:var(--mu)}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ln)}
.cell{padding:14px 22px;border-left:1px solid var(--ln)}
.cell:first-child{border-left:0}
.cell .k{font-size:12px;line-height:16px;color:var(--mu)}
.cell .n{font:600 20px/28px 'Geist',sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.cell .n a{text-decoration:none}
.cell .s{font-size:12px;line-height:16px;color:var(--mu)}

/* selos e marcadores */
.bd{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 7px;border-radius:6px;font:500 12px/16px 'Geist',sans-serif;white-space:nowrap;background:var(--sk);color:var(--i2)}
.bd::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor}
.bd.ok{background:var(--ob);color:var(--oi)}
.bd.wr{background:var(--wb);color:var(--wi)}
.bd.dg{background:var(--db);color:var(--di)}
.dt{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--mu);margin-right:6px;vertical-align:1px}
.dt.w{background:#D98A0B}.dt.r{background:var(--neg)}.dt.g{background:var(--ac)}

/* listas */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--ln2);min-height:60px}
.ch + .lrow,.ch + sc-for > .lrow:first-child{border-top:0}
.lrow:hover{background:var(--sk)}
.lrow .tx{flex:1;min-width:0}
.lrow .tt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .st{font-size:13px;line-height:18px;color:var(--mu);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lrow .amt{font-weight:600;font-variant-numeric:tabular-nums}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 11px/14px 'Geist',sans-serif;flex:none;color:var(--i2);background:var(--sk);border:1px solid var(--ln)}
.av.lg2{width:44px;height:44px;font-size:14px}

/* tabela */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:500 12px/16px 'Geist',sans-serif;color:var(--mu);padding:10px 14px;white-space:nowrap;border-bottom:1px solid var(--ln);background:var(--sf)}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
th.num{text-align:right}
td{padding:12px 14px;border-top:1px solid var(--ln2);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--sk)}
td .nm{font-weight:500}
td a.row{color:inherit;text-decoration:none;display:block}
.rowav{display:flex;align-items:center;gap:10px}
.cr0{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px;font-variant-numeric:tabular-nums}
.foot{padding:10px 18px;border-top:1px solid var(--ln);font-size:12px;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
table.cmp td{padding-top:10px;padding-bottom:10px}

/* gaveta do cliente */
.stage{position:relative;overflow:hidden;width:100%}
.scrim{position:absolute;inset:0;background:var(--sc)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--sf);border-left:1px solid var(--ln);display:flex;flex-direction:column;box-shadow:var(--sh2)}
.dh{padding:18px 20px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--ln)}
.dh .tp{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh h2{font:600 18px/24px 'Geist',sans-serif;letter-spacing:-.015em}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--ln)}
.dstats>div{padding:14px 20px;border-left:1px solid var(--ln)}
.dstats>div:first-child{border-left:0}
.dstats .k{font-size:12px;color:var(--mu)}
.dstats .n{font:600 15px/22px 'Geist',sans-serif;margin-top:2px}
.dstats .n.big{font-size:28px;line-height:34px;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.dact{display:flex;flex-wrap:wrap;gap:8px}
.saldo{margin:0 20px 16px;padding:14px 16px;border-radius:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--sk)}
.saldo .v{font:600 32px/38px 'Geist',sans-serif;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.saldo .l{font-size:13px;color:var(--mu)}
.db{padding:0 20px 24px;overflow:auto;flex:1}
.mv{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln2)}
.ph + sc-for > .mv:first-child,.ph + .mv{border-top:0}
.mv .tx{flex:1;min-width:0}
.mv .tt{font-weight:500}
.mv .st{font-size:12px;line-height:16px;color:var(--mu);margin-top:1px}
.mv .d{font:500 13px/18px 'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.ph{font:500 12px/16px 'Geist',sans-serif;color:var(--mu);margin:18px 0 4px}
.sec{border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--sf)}
.sec h3{font:600 14px/20px 'Geist',sans-serif;margin-bottom:10px}
.sec.dz{border-color:var(--db)}
.sec.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.cl{display:flex;gap:10px;padding:12px 14px;border-radius:10px;align-items:flex-start}
.cl.dg{background:var(--db);color:var(--di)}
.cl.ok{background:var(--ob);color:var(--oi)}
.cl.wr{background:var(--wb);color:var(--wi)}
.cl .ct{font-weight:600}
.cl p{font-size:13px;line-height:18px}

/* estados */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:44px 24px}
.empty .ic{width:40px;height:40px;border-radius:10px;background:var(--sk);color:var(--i2);display:grid;place-items:center;margin-bottom:12px;border:1px solid var(--ln)}
.empty h3{font:600 15px/22px 'Geist',sans-serif}
.empty p{color:var(--mu);max-width:320px;margin-bottom:14px;font-size:13px;line-height:18px}
.sb{background:linear-gradient(90deg,var(--sk) 0%,var(--ln2) 50%,var(--sk) 100%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:5px;display:block}
@keyframes sh{to{background-position:-200% 0}}

.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;background:var(--tst);color:var(--tsi);font-weight:500;font-size:13px;box-shadow:var(--sh2)}
.toast svg{color:inherit}

/* códigos */
.uso{display:flex;flex-direction:column;gap:6px;min-width:100px;font-size:13px;font-variant-numeric:tabular-nums}
.uso .b{height:4px;border-radius:2px;background:var(--sk);overflow:hidden}
.uso .b i{display:block;height:100%;background:var(--ac)}
.cd{display:inline-flex;align-items:center;gap:8px;font:500 13px/16px 'Geist Mono',monospace;color:var(--ink);background:var(--sk);border-radius:6px;padding:4px 8px;letter-spacing:.02em}
.cols{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}

/* celular */
.bnav{display:none}
.mtop{flex:0 0 100%;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
.mcard{padding:12px 16px;border-top:1px solid var(--ln2);display:flex;gap:12px;align-items:center;min-height:68px}
.mcard .tx{flex:1;min-width:0}
.mcard .tt{font-weight:500}
.mcard .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mcard .cv{font:600 17px/22px 'Geist',sans-serif;font-variant-numeric:tabular-nums}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--sf);border-top:1px solid var(--ln);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--sh2)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--ln);margin:8px auto 0}

@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.cell:nth-child(4){border-left:0}.cell:nth-child(n+4){border-top:1px solid var(--ln)}}
@media (max-width:860px){
.side{display:none}
.main{padding:20px 16px 96px}
.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sf);border-top:1px solid var(--ln);padding:4px 8px}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font:500 11px/14px 'Geist',sans-serif;color:var(--mu);text-decoration:none}
.bnav a.on{color:var(--ink)}
.bnav a.on svg{color:var(--ac)}
.btn,.in{height:44px}
.btn.ibtn,.ibtn{width:44px;height:44px}
.btn.sm{height:36px}
.seg button{height:36px}
.top{margin-bottom:16px}
.rev-h{padding:16px 16px 4px}
.rv{font-size:34px;line-height:40px}
.plot{padding:12px 16px 16px;gap:8px}
.yax{width:40px;height:140px}
.bars{height:140px;gap:3px}
.strip{grid-template-columns:repeat(2,minmax(0,1fr))}
.cell{padding:12px 16px}
.cell:nth-child(n){border-left:1px solid var(--ln);border-top:1px solid var(--ln)}
.cell:nth-child(odd){border-left:0}
.cell:nth-child(-n+2){border-top:0}
.lrow{padding:12px 16px}
}

/* ===== Loja: planos e pagamento Pix (usa as variáveis do admin) ===== */
.shop{flex-direction:column;flex-wrap:nowrap}
.stop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 32px;background:var(--sf);border-bottom:1px solid var(--ln)}
.stop .back{display:inline-flex;align-items:center;gap:6px;color:var(--i2);text-decoration:none;font-weight:500;min-height:40px;padding:0 8px;border-radius:8px}
.stop .back:hover{background:var(--sk);color:var(--ink)}
.sw{max-width:1040px;margin:0 auto;padding:48px 24px 64px;width:100%}

.rcp .fin span{font-weight:600;color:#151515}
.rcp .fin b{font:700 22px/28px 'Geist',sans-serif;color:#0B5A42}

/* B: saldo subindo */
@property --n{syntax:'<integer>';initial-value:55;inherits:false}
.sb2{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:28px;box-shadow:0 24px 48px -28px rgba(0,0,0,.45)}

.meter .u{font-size:18px;font-weight:600;color:var(--i2)}
.meter .plus{margin-left:auto;font:600 14px/20px 'Geist',sans-serif;color:var(--oi);background:var(--ob);padding:4px 10px;border-radius:999px;animation:up .4s ease-out 1.6s both}

.lg2 i.g{background:#16A06F}
.mini{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--ln);font-size:14px;color:var(--mu)}

/* C: mesma tela concluída */
.qr.done{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0E6B4F;border-color:#0E6B4F;color:#fff;text-align:center;animation:flipin .5s ease-out both}
.dark .qr.done{background:#0F5A43;border-color:#0F5A43}
@keyframes flipin{from{opacity:.4;transform:scale(.94)}to{opacity:1;transform:none}}
.qr.done .big{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.5,.4,1) .15s both}
.qr.done .big svg{width:42px;height:42px;stroke:#0E6B4F;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qr.done .big svg path{stroke-dasharray:32;stroke-dashoffset:32;animation:draw .45s ease-out .45s forwards}

.wait.okk{background:var(--ob);color:var(--oi)}
.ts.done:last-child .tm{animation:pop .45s cubic-bezier(.2,1.5,.4,1) .9s both}



body{margin:0}

<script>
(function () {

  async function api(caminho, corpo) {

  function aviso(titulo, texto) {

  }

  async function inicio() {
    clearInterval(timer);
    topoVoltar(true);
    app.innerHTML = '<p class="carregando">Carregando os pacotes...</p>';

    try { e = await api('/api/creditos'); } catch (er) { return aviso('Não consegui abrir os pacotes', er.message); }
    if (!e.ligado) return aviso('Compra de créditos indisponível', 'O servidor de créditos ainda não está configurado neste programa.');
    if (e.offline) return aviso('Sem conexão', 'Confira a internet e abra esta página de novo.');
    if (e.bloqueado) return aviso('Acesso bloqueado', 'Fale com o Carlos para entender o motivo.');
    if (e.cobranca === false) return aviso('Uso liberado', 'Por enquanto nenhuma nota gasta crédito. Pode usar à vontade.');
    var lista = e.pacotes || [];
    window.__pacotes = {}; lista.forEach(function (p) { window.__pacotes[p.id] = p; });
    var maiorPorNota = Math.max.apply(null, lista.map(function (p) { return p.preco / p.creditos; }).concat([0]));
    var saldo = typeof e.saldo === 'number' ? e.saldo : null;
    var tabela = lista.map(function (p) { return p.preco / p.creditos; });
    var maiorPorNota = Math.max.apply(null, tabela.concat([0]));
    var menorPorNota = Math.min.apply(null, tabela.concat([Infinity]));
    var CHECK = S('<path d="M20 6 9 17l-5-5"/>');

    }).join('');
    var CARTEIRA = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 12h-5a2 2 0 0 0 0 4h5Z"/></svg>';
    var estado = saldo === null ? '' : saldo <= 0 ? 'zero' : saldo <= 10 ? 'low' : 'ok';

        + (estado === 'ok' ? '' : '<a class="cta" href="#pacotes">' + (saldo <= 0 ? 'Compre um pacote para continuar' : 'Recarregue para não parar no meio') + S('<path d="M12 5v14M19 12l-7 7-7-7"/>') + '</a>')
        + '</div></div>';
    }
    app.innerHTML = '<main class="sw">'
      + '<section class="shero"><div><h1>Compre créditos para lançar suas notas</h1><p>1 crédito = 1 nota fiscal lançada na planilha. Sem mensalidade: você paga só pelo que usar.</p></div>' + balanco + '</section>'
      + '<section class="plans" id="pacotes" aria-label="Pacotes">' + (cartoes || '<p class="mu">Nenhum pacote disponível agora.</p>') + '</section>'
      + '<div class="trust"><span>' + ICO.pix + 'Pagamento por Pix</span><span>' + ICO.escudo + 'Cobrança gerada pelo Mercado Pago</span><span>' + ICO.raio + 'Créditos entram sozinhos</span><span>' + ICO.cal + 'Sem cartão e sem mensalidade</span></div>'
      + '<section class="duo"><div class="card"><div class="ch"><h2>Como funciona</h2></div><div class="steps">'

  function mmss(ms) { var s = Math.max(0, Math.round(ms / 1000)); return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2); }

  var pacoteAtual = null;

      var partes = brl(p.valor).replace(/\s/g, ' ').split(' ');
      app.innerHTML = '<main class="pix"><div class="ptitle"><div><h1>Pague com Pix</h1><p>' + esc(nome) + '</p></div></div>'

        + '<div class="qr"><img src="data:' + (p.qrBase64.indexOf("PHN2Zy")===0 ? "image/svg+xml" : "image/png") + ';base64,' + p.qrBase64 + '" alt="QR Code do Pix de ' + esc(brl(p.valor)) + '"><span class="scan" aria-hidden="true"></span></div>'
        + '<div class="cc"><p class="lb">Ou use o Pix copia e cola</p><span class="ccv" title="O código completo vai junto quando você clicar em Copiar">' + esc(p.copiaECola.slice(0, 34)) + '…</span><button type="button" class="btn pri" id="btCopiar" data-acao="copiar">Copiar código Pix</button></div>'

        + '<div class="how"><h3>Como pagar</h3><ol><li>Abra o app do seu banco e entre na área Pix.</li><li>Escolha <b>Ler QR Code</b> ou <b>Pix copia e cola</b>.</li><li>Confira o valor de ' + esc(brl(p.valor)) + ' e confirme.</li></ol></div></div></section>'

          if (s.status === 'pago') {

            app.innerHTML = '<main class="pix"><div class="ptitle"><div><h1>Pagamento concluído</h1><p>' + (pacoteAtual ? 'Pacote de ' + qtd : 'Pacote de créditos') + '</p></div></div>'
              + '<section class="pbox" role="status" aria-live="polite"><div class="pl"><div class="qr done"><span class="big"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></span><b>Pago</b><span>Recebido às ' + hora + '</span></div>'
              + '<p class="exp" style="text-align:center">Você já pode fechar esta tela.</p></div>'
              + '<div class="pr2"><div><p class="pk">Valor pago</p><p class="pamt"><span>R$</span>' + esc(brl(p.valor).replace(/^R\$\s?/, '')) + '</p>' + (sub ? '<p class="psub">' + esc(sub) + '</p>' : '') + '</div>'
              + '<span class="wait okk">' + ok + 'Pagamento confirmado</span>'
              + '<div class="tl" aria-label="Andamento do pagamento">'
              + '<div class="ts done"><span class="tm">' + ok + '</span><div><p class="t">Pix gerado</p><p class="d">' + criado + '</p></div></div>'
              + '<div class="ts done"><span class="tm">' + ok + '</span><div><p class="t">Pagamento recebido</p><p class="d">' + hora + ' · Mercado Pago</p></div></div>'
              + '<div class="ts done"><span class="tm">' + ok + '</span><div><p class="t">' + qtd + ' liberados</p><p class="d">Seu saldo agora é de <b style="color:var(--ink)">' + creditos(s.saldo) + '</b></p></div></div></div>'
              + '<div class="acts2" style="margin-top:0;align-items:stretch"><a class="btn pri" href="/">Voltar e lançar notas</a><a class="lnk" href="#" data-acao="voltar">Comprar mais créditos</a></div></div></section></main>';
          } else if (s.status === 'cancelado') {
            clearInterval(timer);
            var tm = document.querySelector('.ts.now .tm'); if (tm) tm.innerHTML = ''; var cg = null; st.className = 'wait'; st.style.cssText = 'background:var(--db);color:var(--di)';
            st.innerHTML = 'Esse pagamento foi cancelado. Escolha o pacote de novo.';
          }
        } catch (e) { /* sem internet por um instante: tenta no próximo ciclo */ }
      }, 1000);
    } catch (er) {
      await inicio();
      var m = document.getElementById('msgCod');
      if (m) { m.className = 'msg-st erro'; m.textContent = er.message; m.scrollIntoView({ block: 'center' }); }
    }
  }

  document.addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-pacote],[data-acao]');
    if (!b) return;
    if (b.dataset.pacote) return pagar(b.dataset.pacote, b);
    var a = b.dataset.acao;
    if (a === 'voltar') { ev.preventDefault(); return inicio(); }
    if (a === 'copiar') {
      try { await navigator.clipboard.writeText(app.__copia); b.textContent = 'Código copiado'; b.classList.add('done'); setTimeout(function () { b.textContent = 'Copiar código Pix'; b.classList.remove('done'); }, 2200); }
      catch (e) { b.textContent = 'Selecione o código acima e copie'; }
    }
  });
  document.addEventListener('submit', async function (ev) {
    if (ev.target.id !== 'formCod') return;
    ev.preventDefault();
    var msg = document.getElementById('msgCod');
    try {
      var r = await api('/api/creditos/resgatar', { codigo: document.getElementById('cod').value.trim() });
      msg.className = 'msg-st ok'; msg.textContent = '+' + creditos(r.creditos) + '. Agora você tem ' + creditos(r.saldo) + '.';
    } catch (e) { msg.className = 'msg-st erro'; msg.textContent = e.message; }
  });
  inicio();
})();
</script>
</body>
</html>
