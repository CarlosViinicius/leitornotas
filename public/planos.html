<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planos · Leitor de Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0A110E; color: #F2F7F4; font-family: Inter, system-ui, sans-serif; }
  a { color: #A3B5AD; text-decoration: none; }
  a:hover { color: #F2F7F4; }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #3DDC84; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .pagina { min-height: 100vh; position: relative; overflow: hidden; }
  .brilho { position: absolute; left: 50%; top: -240px; width: 1000px; height: 600px; margin-left: -500px; border-radius: 50%; background: radial-gradient(closest-side, rgba(61,220,132,0.14), rgba(61,220,132,0)); pointer-events: none; }
  .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
  @media (max-width: 880px) { .plans { grid-template-columns: minmax(0, 1fr); } }
  @media (min-width: 881px) { .feat { transform: scale(1.06); z-index: 2; } }
  .btn:hover { filter: brightness(1.1); }
  .faq:hover { background: #121E19 !important; }
  .field::placeholder { color: #6E827A; }
  @media (prefers-reduced-motion: no-preference) { .btn, .tg, .faq { transition: all .16s ease; } }
  .field { min-height: 50px; padding: 0 16px; border: 1px solid #2B3E36; border-radius: 12px; background: #0A110E; color: #F2F7F4; font-size: 15px; width: 100%; }
  textarea.field { padding: 14px 16px; resize: vertical; }
  label { font-size: 14px; font-weight: 600; }
  .campo { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<div class="pagina">
  <div class="brilho" aria-hidden="true"></div>

  <header style="position: relative; border-bottom: 1px solid #1A2722">
    <div style="max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 32px; height: 32px; border-radius: 9px; background: #3DDC84; color: #04170C; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6"></path><path d="M9 12h6"></path></svg>
        </span>
        <span style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 17px">Leitor de Notas</span>
      </div>
      <a href="/" style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; min-height: 44px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
        Voltar ao programa
      </a>
    </div>
  </header>

  <div id="app"></div>
</div>

<script>
(function () {
  // Preços mensais (R$) e desconto do plano anual: ajuste aqui.
  var PRECOS = [29, 59, 119];
  var DESCONTO = 20;

  // Recursos na mesma ordem para os três planos: [Básico, Profissional, Equipe]
  var RECURSOS = [
    ['Leitura de PDF e foto', [1, 1, 1]],
    ['Excel e Google Planilhas', [0, 1, 1]],
    ['Carta de correção', [0, 1, 1]],
    ['Desfazer lançamento', [0, 1, 1]],
    ['Backup automático da planilha', [0, 1, 1]],
    ['Várias planilhas', [0, 0, 1]],
    ['Até 5 auditores', [0, 0, 1]],
    ['Relatório de produtividade', [0, 0, 1]],
    ['Suporte prioritário', [0, 0, 1]]
  ];

  var PLANOS = [
    { nome: 'Básico', desc: 'Para quem lança poucas notas por mês.', cota: 'Até 100 notas por mês', cta: 'Começar no Básico' },
    { nome: 'Profissional', desc: 'Para o auditor que lança notas todos os dias.', cota: 'Até 500 notas por mês', cta: 'Assinar Profissional', destaque: true },
    { nome: 'Equipe', desc: 'Para escritórios com vários auditores.', cota: 'Notas ilimitadas', cta: 'Falar no WhatsApp', equipe: true }
  ];

  var FAQ = [
    ['Posso trocar de plano depois?', 'Pode. Você troca de plano quando quiser, para cima ou para baixo, conforme o volume de notas do seu mês.'],
    ['Em que formato eu envio as notas?', 'Você arrasta o PDF ou a foto da nota fiscal para a tela (ou cola com Ctrl+V). O Leitor de Notas lê os dados, você confere e ele lança direto na sua planilha.'],
    ['Quais planilhas funcionam?', 'No Básico, você lança em 1 planilha de destino. No Profissional, em Excel e Google Planilhas. No Equipe, em várias planilhas ao mesmo tempo.'],
    ['Como funciona o plano anual?', 'No plano anual você paga uma vez por ano e ganha ' + DESCONTO + '% de desconto em relação ao valor mensal.'],
    ['O que acontece se eu passar do limite de notas?', 'Suas notas e sua planilha continuam guardadas, nada é apagado. Ao chegar perto do limite do mês, você pode trocar de plano na hora para seguir lançando.']
  ];

  var WHATSAPP = '5544997474225';
  var MSG_EQUIPE = 'Olá Carlos! Tenho um escritório com vários auditores e quero saber do plano Equipe do Leitor de Notas.';

  var METODOS = [['card', 'Cartão'], ['pix', 'Pix'], ['boleto', 'Boleto'], ['flash', 'Flash']];

  var s = {
    cobranca: 'mensal', sel: null, etapa: 'pay', metodo: 'card', copiado: false, faqAberta: 0,
    num: '', titular: '', val: '', cvv: '', pix: null
  };

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return n.toLocaleString('pt-BR'); };
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var anual = function () { return s.cobranca === 'anual'; };
  var mensalDe = function (p) { return anual() ? Math.floor(p * (100 - DESCONTO) / 100) : p; };
  var notaDe = function (m) { return anual() ? 'R$ ' + fmt(m * 12) + ' cobrados por ano' : 'Cobrado todo mês'; };

  var ICONE = {
    ok: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>',
    okP: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>',
    no: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>',
    voltar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>',
    seta: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>',
    mais: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>',
    estrela: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg>',
    info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>',
    cadeado: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>',
    boleto: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5v14"></path><path d="M8 5v14"></path><path d="M11 5v14"></path><path d="M15 5v14"></path><path d="M17 5v14"></path><path d="M20 5v14"></path></svg>',
    escudo: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"></path><path d="M9 12l2.2 2.2L15.5 10"></path></svg>',
    pix: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M9 12l3 3 3-3-3-3z"></path></svg>',
    zap: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5A8.5 8.5 0 1 1 21 11.5z"></path></svg>',
    cartao: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect><path d="M2.5 10h19M6.5 15h4"></path></svg>',
    check: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>'
  };

  // Estilos que dependem do estado
  var BASE = 'display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; font-size: 15px; font-weight: 600;';
  var LIGADO = BASE + ' background: #3DDC84; color: #04170C;';
  var DESLIGADO = BASE + ' background: transparent; color: #A3B5AD;';

  function seletorCobranca(cheio) {
    var m = !anual();
    var extra = cheio ? ' flex: 1; padding: 0 12px;' : '';
    var pill = anual()
      ? 'padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(4,23,12,0.2); color: #04170C'
      : 'padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(61,220,132,0.16); color: #3DDC84';
    var grupo = cheio
      ? 'margin-top: 18px; display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: #0A110E'
      : 'margin-top: 14px; display: inline-flex; padding: 5px; gap: 4px; border: 1px solid #21322B; border-radius: 999px; background: #0F1915';
    return '<div role="group" aria-label="Período de cobrança" style="' + grupo + '">'
      + '<button class="tg" type="button" data-cobranca="mensal" aria-pressed="' + m + '" style="' + (m ? LIGADO : DESLIGADO) + extra + '">Mensal</button>'
      + '<button class="tg" type="button" data-cobranca="anual" aria-pressed="' + anual() + '" style="' + (anual() ? LIGADO : DESLIGADO) + extra + '">Anual '
      + (cheio ? '-' + DESCONTO + '%' : '<span style="' + pill + '">-' + DESCONTO + '%</span>') + '</button></div>';
  }

  // Prévia visual do boleto (não é um documento pagável: sem código real, só para o cliente ver como será).
  function barrasBoleto() {
    var html = '', x = 7;
    for (var k = 0; k < 130; k++) {
      x = (x * 31 + 11) % 97;
      var larg = 1 + (x % 3);
      html += '<span style="flex: ' + larg + ' 1 0; min-width: 0; height: 100%; background: #111;"></span><span style="flex: ' + (1 + (x % 2)) + ' 1 0; min-width: 0"></span>';
    }
    return html;
  }

  function boletoPrevia(total, p) {
    var venc = new Date(); venc.setDate(venc.getDate() + 3);
    var dataVenc = venc.toLocaleDateString('pt-BR');
    var rot = 'font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #5B6761; font-weight: 600';
    var cel = function (titulo, valor, extra) {
      return '<div style="padding: 8px 10px; border: 1px solid #C9D2CD; ' + (extra || '') + '"><div style="' + rot + '">' + titulo + '</div><div style="margin-top: 3px; font-size: 14px; font-weight: 600; color: #111">' + valor + '</div></div>';
    };
    return '<div style="margin-top: 24px">'
      + '<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(250,204,21,0.08); border: 1px solid rgba(250,204,21,0.25); color: #F5DE8A; font-size: 13px; line-height: 1.4">' + ICONE.info + 'Esta é só uma prévia de como o boleto aparece. O boleto de verdade é enviado pelo Carlos, pelo WhatsApp.</div>'
      + '<div style="position: relative; margin-top: 16px; overflow: hidden; border-radius: 6px; background: #FFFFFF; color: #111; box-shadow: 0 24px 50px -24px rgba(0,0,0,0.8)">'
      + '<div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 2px solid #111">'
      + '<span style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 16px">Leitor de Notas</span>'
      + '<span style="margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #444">Boleto de cobrança</span></div>'
      + '<div style="padding: 10px 12px"><div style="padding: 8px 10px; border: 1px solid #C9D2CD"><div style="' + rot + '">Linha digitável (exemplo)</div><div style="margin-top: 3px; font-family: Consolas, monospace; font-weight: 700; font-size: clamp(10px, 2.6vw, 15px); letter-spacing: 0.02em; color: #111; word-break: break-all">00000.00000 00000.000000 00000.000000 0 00000000000000</div></div></div>'
      + '<div style="padding: 0 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0">'
      + cel('Beneficiário', esc(s.pix ? s.pix.nome : 'Carlos Vinicius'))
      + cel('Vencimento', dataVenc)
      + cel('Valor do documento', 'R$ ' + total, 'background: #F3F6F4')
      + cel('Plano', esc(p.nome) + ' · ' + (anual() ? 'anual' : 'mensal'))
      + cel('Pagador', 'Você')
      + cel('Nosso número', '0000000000')
      + '</div>'
      + '<div style="padding: 14px 12px 16px"><div aria-hidden="true" style="display: flex; align-items: stretch; height: 56px; overflow: hidden">' + barrasBoleto() + '</div></div>'
      + '</div></div>';
  }

  // Faixa de confiança: o que acontece com as notas e como o pagamento funciona.
  function confianca() {
    var itens = [
      [ICONE.escudo, 'Suas notas ficam guardadas', 'Nada é apagado: suas notas e sua planilha continuam do jeito que estão.'],
      [ICONE.pix, 'Pagamento por Pix', 'Cai direto na conta do Carlos, sem intermediário e sem cadastro de cartão.'],
      [ICONE.zap, 'Liberação com código', 'Você paga, o Carlos confere e manda o código pelo WhatsApp.']
    ];
    return '<div style="margin: 56px auto 0; max-width: 1000px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">'
      + itens.map(function (it) {
        return '<div style="display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px; border: 1px solid #1E2C26; border-radius: 16px; background: #0E1713">'
          + '<span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: rgba(61,220,132,0.12); color: #3DDC84; display: flex; align-items: center; justify-content: center">' + it[0] + '</span>'
          + '<div><p style="margin: 0; font-size: 15px; font-weight: 700">' + it[1] + '</p><p style="margin: 4px 0 0; font-size: 13.5px; line-height: 1.5; color: #A3B5AD">' + it[2] + '</p></div></div>';
      }).join('') + '</div>';
  }

  // ---------- Tela dos planos ----------
  function telaPlanos() {
    var cartoes = PLANOS.map(function (p, i) {
      var m = mensalDe(PRECOS[i]);
      var base = 'position: relative; display: flex; flex-direction: column; padding: 32px 28px; border-radius: 22px;';
      var btn = 'margin-top: 22px; min-height: 50px; border-radius: 12px; font-weight: 700; font-size: 15px;';
      var cardStyle = p.destaque
        ? base + ' border: 2px solid #3DDC84; background: radial-gradient(120% 70% at 50% 0%, rgba(61,220,132,0.22) 0%, rgba(61,220,132,0) 60%), #0F1B16; box-shadow: 0 0 0 6px rgba(61,220,132,0.08), 0 40px 90px -30px rgba(61,220,132,0.6);'
        : base + ' border: 1px solid #1E2C26; background: #0E1713;';
      var priceStyle = p.destaque
        ? 'font-family: Manrope, sans-serif; font-weight: 800; font-size: 84px; line-height: 1; letter-spacing: -0.05em; color: #3DDC84; text-shadow: 0 0 40px rgba(61,220,132,0.45);'
        : 'font-family: Manrope, sans-serif; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.05em; color: #F2F7F4;';
      var btnStyle = p.destaque
        ? btn + ' border: 0; background: #3DDC84; color: #04170C;'
        : btn + ' border: 1px solid #2B3E36; background: transparent; color: #F2F7F4;';
      var selo = p.destaque
        ? '<span style="position: absolute; top: -17px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; background: #3DDC84; color: #04170C; font-size: 13px; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap; box-shadow: 0 8px 24px -6px rgba(61,220,132,0.7)">' + ICONE.estrela + 'Recomendado</span>'
        : '';
      var itens = RECURSOS.map(function (r) {
        var tem = !!r[1][i];
        if (tem) {
          return '<li style="display: flex; align-items: center; gap: 12px; color: #E3ECE7;"><span style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: rgba(61,220,132,0.16); color: #3DDC84; display: flex; align-items: center; justify-content: center">' + ICONE.ok + '</span><span>' + r[0] + '</span></li>';
        }
        return '<li style="display: flex; align-items: center; gap: 12px; color: #6E827A; text-decoration: line-through; text-decoration-color: rgba(110,130,122,0.5);"><span style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #18231F; color: #6E827A; display: flex; align-items: center; justify-content: center">' + ICONE.no + '</span><span>' + r[0] + '<span class="sr"> (não incluso)</span></span></li>';
      }).join('');
      return '<section class="' + (p.destaque ? 'feat' : '') + '" style="' + cardStyle + '">' + selo
        + '<h2 style="margin: 0; font-family: Manrope, sans-serif; font-weight: 700; font-size: 20px">' + p.nome + '</h2>'
        + '<p style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: #A3B5AD; min-height: 40px">' + p.desc + '</p>'
        + '<div style="margin-top: 22px; display: flex; align-items: flex-start; gap: 4px">'
        + '<span style="margin-top: 10px; font-family: Manrope, sans-serif; font-size: 22px; font-weight: 700; color: #A3B5AD">R$</span>'
        + '<span style="' + priceStyle + '">' + fmt(m) + '</span>'
        + '<span style="align-self: flex-end; margin-bottom: 10px; font-size: 16px; font-weight: 500; color: #A3B5AD">/mês</span></div>'
        + '<p style="margin: 8px 0 0; font-size: 13px; color: #869A91">' + notaDe(m) + '</p>'
        + (p.equipe
          ? '<a class="btn" href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MSG_EQUIPE) + '" target="_blank" rel="noopener" style="' + btnStyle + ' display: flex; align-items: center; justify-content: center; gap: 8px">' + ICONE.zap + p.cta + '</a>'
          : '<button class="btn" type="button" data-escolher="' + i + '" style="' + btnStyle + '">' + p.cta + '</button>')
        + '<div style="margin-top: 24px; padding: 12px 14px; border-radius: 12px; background: #13201B; font-size: 14px; font-weight: 600; color: #F2F7F4; text-align: center">' + p.cota + '</div>'
        + '<ul style="list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 13px; font-size: 14px">' + itens + '</ul>'
        + '</section>';
    }).join('');

    var perguntas = FAQ.map(function (f, i) {
      var aberta = s.faqAberta === i;
      var icone = 'flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; '
        + (aberta ? 'background: #3DDC84; color: #04170C; transform: rotate(45deg);' : 'background: #18231F; color: #3DDC84;');
      return '<div style="border: 1px solid #1E2C26; border-radius: 16px; background: #0E1713; overflow: hidden">'
        + '<button class="faq" type="button" data-faq="' + i + '" aria-expanded="' + aberta + '" style="width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border: 0; background: transparent; color: #F2F7F4; text-align: left; font-size: 16px; font-weight: 600">'
        + '<span>' + f[0] + '</span><span style="' + icone + '">' + ICONE.mais + '</span></button>'

  function qrCelulas() {
    var N = 25, html = '';
    function finder(x, y) {
      var cantos = [[0, 0], [N - 7, 0], [0, N - 7]];
      for (var k = 0; k < cantos.length; k++) {
        var a = x - cantos[k][0], b = y - cantos[k][1];
        if (a >= 0 && a < 7 && b >= 0 && b < 7) {
          var borda = a === 0 || a === 6 || b === 0 || b === 6;
          var miolo = a >= 2 && a <= 4 && b >= 2 && b <= 4;
          return borda || miolo ? 1 : 0;
        }
        if (a >= -1 && a <= 7 && b >= -1 && b <= 7) return 0;
      }
      return -1;
    }
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var f = finder(x, y);
      var bit = f === -1 ? ((x * 31 + y * 17 + x * y * 7 + (x ^ y) * 3) % 5 < 2) : f === 1;
      html += '<span style="background: ' + (bit ? '#04170C' : 'transparent') + ';"></span>';
    }
    return html;
  }

      e.target.value = v; s.val = v;
      $('cartaoVal').textContent = v || 'MM/AA';
    } else if (id === 'ccvv') {
      s.cvv = e.target.value.replace(/\D/g, '').slice(0, 4);
      e.target.value = s.cvv;
    }
  });

  desenhar();
})();
</script>
